name: New disc edition
description: Your disc is refused as an edition the launcher doesn't know yet.
title: "New disc edition: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        On the game's page, under the message about your disc, click **Find my edition** and paste the report below
        (it is copied for you). It holds the game, its title and media IDs, its version, region and languages, the size
        and SHA-256 of `default.xex` and of its game code, whether that code is a supported edition's, and the addresses
        of the game the tools found in it. Nothing from the game itself. If Find my edition can't run, click
        **Copy disc details** instead and paste those.

        **Never attach the disc image (ISO) or any file from the game.**
  - type: textarea
    id: details
    attributes:
      label: Edition report
      description: Paste what "Find my edition" (or "Copy disc details") copied.
      render: text
    validations:
      required: true
  - type: input
    id: disc
    attributes:
      label: Where the disc comes from
      description: The country it was bought in, and what its box says (for example "Xbox 360, PAL, Germany").
    validations:
      required: false
  - type: dropdown
    id: system
    attributes:
      label: Your computer
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
